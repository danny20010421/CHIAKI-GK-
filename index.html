  const el = e.target, k = el.dataset.k;
  if (el.matches('[data-act="x-upl"]') && el.files[0]){
    const box = el.closest('.upl'), out = $('.upl-out', box), key = el.dataset.spec, r = await checkImage(el.files[0], key), s = IMG_SPEC[key];
    out.innerHTML = `<div class="upl-res">${r.url ? `<div class="upl-prev" style="aspect-ratio:${s.h ? s.w + '/' + s.h : 'auto'}"><img src="${r.url}" alt="預覽"><i style="inset:${(1 - (s.safe || 1)) / 2 * 100}%" title="安全區"></i></div>` : ''}
      <ul>${r.rows.map(([n, ok, d]) => `<li class="${ok?'ok':'no'}">${ok ? ic('check','width:14px;height:14px') : ic('x','width:14px;height:14px')}<b>${n}</b><span>${d}</span></li>`).join('')}</ul>
      <span class="tag ${r.ok?'ok':'bad'}">${r.ok ? '符合規範，可上傳' : '不符合規範，請修正後重新上傳'}</span></div>`;
  }
  if (el.matches('[data-act="x-speck"]')) $('#spU').innerHTML = uploader(el.value, 'spFile');
  if (el.matches('[data-act="x-admpool"]')){ S.admPool = el.value; render(true); }
  const p = poolById(S.admPool) || POOLS[0];
  if (el.matches('[data-act="x-prn"]')){ p.prizes[+k].name = el.value; toast('已更新獎品名稱'); }
  if (el.matches('[data-act="x-prv"]')){ p.prizes[+k].rv = Math.max(0, +el.value || 0); toast('已更新回收值'); }
  if (el.matches('[data-act="x-prg"]')){ const pr = p.prizes[+k]; pr.g = el.value; pr.tier = GRADE[pr.g].tier; toast('已更新等級'); }
  if (el.matches('[data-act="x-vipmin"]')){ const v = Math.max(0, Math.floor(+el.value || 0)); el.value = v; S.vipT[+k].min = v; toast('已更新門檻'); }
  if (el.matches('[data-act="x-vipperk"]')){ S.vipT[+k].perk = el.value; toast('已更新權益'); }
});
document.addEventListener('input', e => { if (e.target.matches('[data-act="x-drq"]')){ S.drawQ = e.target.value; clearTimeout(window.__dq); window.__dq = setTimeout(() => { const pos = e.target.selectionStart; render(true); const n = $('#drQ'); if (n){ n.focus(); n.setSelectionRange(pos, pos); } }, 250); } });
document.addEventListener('submit', e => {
  if (e.target.matches('[data-act="x-cfgsave"]')){ e.preventDefault(); $$('[data-cfg]', e.target).forEach(i => { S.cfg[i.dataset.cfg] = i.type === 'number' ? +i.value : i.value; });
    S.audit.unshift({t:'剛剛', who:'輝', a:'更新系統設定'}); toast('設定已儲存，並寫入操作日誌'); }
  if (e.target.matches('[data-act="x-poolsave"]')){ e.preventDefault(); poolSave(e.target.dataset.k, '草稿'); }
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act^="x-"]'); if (!el || el.tagName === 'FORM' || el.tagName === 'SELECT' || el.tagName === 'INPUT') return;
  const a = el.dataset.act, k = el.dataset.k;
  const A = {
    'x-pooled': () => poolEditor(k),
    'x-poolsubmit': () => poolSave(k, '待覆核'),
    'x-adm-go': () => { S.admin = k; if (el.dataset.p) S.admPool = el.dataset.p; render(true); scrollTo(0,0); },
    'x-csv': () => { const rows = drawRows(), csv = '﻿時間,交易編號,會員,賞池,套,籤號,結果\n' + rows.map(r => [r.at,r.tx,r.user,r.pool,r.set,r.no,r.res].map(x => `"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
      const u = URL.createObjectURL(new Blob([csv], {type:'text/csv'})), l = document.createElement('a'); l.href = u; l.download = 'chiaki-draws.csv'; l.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); toast('已匯出 CSV'); },
    'x-mfreeze': () => { const m = S.members[+k]; m.st = m.st === '正常' ? '凍結' : '正常'; S.audit.unshift({t:'剛剛', who:'輝', a:`${m.st==='凍結'?'凍結':'解除凍結'}會員 ${m.uid}`}); render(true); toast(`已${m.st==='凍結'?'凍結':'解除凍結'}帳號`); },
    'x-madj': () => toast('點數調整已送出，超過 1,000 點需第二位管理員覆核'),
    'x-recon': () => { S.topups.forEach(t => { if (t.st === '已入帳') t.rc = '相符'; }); toast('對帳完成：已入帳款項與綠界紀錄相符'); render(true); },
    'x-cpadd': () => { S.coupons.push({code:'NEW' + (S.coupons.length + 1), d:'新優惠券（請編輯內容）', used:0, exp:'2026-12-31', on:false}); render(true); toast('已新增，預設為停用'); },
    'x-cpon': () => { S.coupons[+k].on = !S.coupons[+k].on; render(true); },
    'x-apiadd': () => { S.apiKeys.push({k:'ck_live_••••' + Math.random().toString(16).slice(2,6), n:'新金鑰', at:'2026-10-23', on:true}); render(true); toast('已產生新金鑰，完整金鑰僅顯示一次'); },
    'x-apirev': () => { S.apiKeys[+k].on = false; render(true); toast('金鑰已撤銷'); },
    'x-toast': () => toast(el.dataset.v)
  };
  if (A[a]){ e.preventDefault(); A[a](); }
});
/* register the new admin module */
ADM.splice(ADM.findIndex(a => a[1] === 'set') + 1, 0, ['系統','spec','素材規範','doc']);
</script>
<script>
/* =========================================================
   CHIAKI 線上一番賞｜遊戲規則、規範與注意事項（全文）
   ========================================================= */
const ul = a => `<ul>${a.map(x => `<li>${x}</li>`).join('')}</ul>`;
const ol = a => `<ol>${a.map(x => `<li>${x}</li>`).join('')}</ol>`;
const RULES = [
['前言', `<p>歡迎參與 <strong>CHIAKI 線上一番賞</strong>。為保障所有玩家權益、維持抽賞活動之公平性並確保交易資訊透明，請於儲值、購買及進行抽賞前，詳細閱讀以下遊戲規則、商品資訊及相關注意事項。</p>
<p>玩家完成付款、使用代幣並確認進行抽賞，即表示已閱讀、理解並同意本規則。</p>`],
['一、基本遊戲規則', ol([
 '本活動採「線上隨機抽賞」方式進行，採固定獎品清單、無放回抽取之「有限賞池制」，所有公開獎項皆存在於該賞池中，並隨玩家抽取逐步減少。',
 '每一抽所需代幣、剩餘抽數、獎項內容、各獎項數量及其他相關資訊，皆以該賞池活動頁面當下顯示之內容為準。',
 '設有多套之賞池，每一套之籤數、獎項與抽取結果均獨立計算。',
 '玩家須先完成儲值取得代幣，再使用代幣購買抽賞次數。',
 '賞池發布時即固定全部籤號與獎項之對應，並公開承諾雜湊值；玩家確認抽賞後，結果由本平台伺服器依該套當下剩餘籤號確定，完售後公開完整籤表供驗證。',
 '抽賞結果一經系統成功產生，即視為該次抽賞完成。除系統異常或法令另有規定外，不得要求重新抽取、更換結果或指定其他獎項。',
 '每一項獎品經抽出後，即自該賞池之剩餘獎項及抽數中扣除；當所有有效抽數皆完成後，該賞池即正式結束。',
 '若賞池因剩餘獎項狀況、商品供應或其他營運因素需提前結束，本平台得停止後續抽數之銷售，且不影響已成立之交易及已完成之抽賞結果；如影響最後賞之取得方式，依該賞池事前公告之規則辦理。'])],
['二、獎項與剩餘數量', `<p>玩家進行抽賞前，應自行確認活動頁面所載之：</p>${ul(['每抽所需代幣','賞池總抽數與當前剩餘抽數','各獎項名稱、原始數量與目前剩餘數量','最後賞規則','保底、加碼等特殊機制','商品版本、尺寸、規格與品況','該套之預收運費與各獎品回收值','其他該賞池特別說明'])}
<p>官方套組以 A 賞、B 賞等賞級標示；<strong>自製套組不設賞級，直接標示獎品名稱</strong>，並由本平台設定大獎、中獎、小獎等級，公開於賞池頁。</p>
<p>若活動頁面另標註「特別賞」「加碼賞」「保底」「累積獎勵」或其他特殊機制，依該賞池事前公告之規則為準。</p>`],
['三、最後賞', `<p>賞池設有「最後賞」者，抽中該套最後一個有效抽數之玩家，可依活動頁面公告之規則取得最後賞。取得方式可能為額外贈送、與原獎品一併取得、取代原獎品或達成特定條件後取得，以各賞池事前公告為準。</p>`],
['四、代幣、儲值與付款成立', `<p>本平台之代幣與點數分為以下三類：</p>${ul([
 '<strong>儲值代幣</strong>：以現金儲值取得，可用於抽賞與購物；未使用之儲值代幣得依《退款與配送規範》申請退款。',
 '<strong>平台代幣（不可退款）</strong>：因獎品逾期自動轉換、回收小獎之運費退還、邀請好友等活動取得，可用於抽賞與購物，但<strong>不可退款、無法轉換或提領</strong>；如有疑問請聯絡官方小編。',
 '<strong>平台點數</strong>：因獎品回收或活動取得，僅限站內折抵，不得提領或兌換現金。'])}
<p>消費時優先扣除平台代幣（不可退款），再扣除儲值代幣。</p>
<p>儲值訂單須經系統確認付款成功後始成立。若因信用卡授權失敗、第三方支付或銀行系統異常、網路中斷、系統未收到付款成功資訊等因素致付款失敗，該筆交易不成立，亦不保留相關儲值或抽賞資格。實際付款狀態以本平台訂單紀錄及金流服務商（綠界科技）之交易紀錄為準。</p>`],
['五、抽賞完成後之取消、退款及重新抽取', `<p>線上一番賞具有即時隨機結果及賞池數量即時變動之特性。抽賞結果成功產生後，除系統異常、交易錯誤或法令另有規定外，不得單純因下列個人因素要求重新抽取、更換獎項或取消抽賞：</p>
${ul(['個人操作失誤','未抽中希望之獎項','抽賞後改變心意','誤認商品或獎項價值','重複抽中相同商品','不喜歡抽中之角色、款式或品項','認為商品市場價格低於抽賞金額','未事先閱讀活動內容、賞池剩餘獎項或本規則'])}
<p>玩家依消費者保護法或其他法令享有之解除契約、退貨、退款、瑕疵擔保或其他權利，不因本條而受影響；如特定商品或服務依法屬得排除通訊交易解除權之合理例外，本平台將於交易前明確揭露。</p>`],
['六、系統異常處理', `<p>抽賞過程如發生畫面卡住、網路中斷、頁面意外關閉、瀏覽器異常、動畫未正常播放或玩家裝置故障，但伺服器已成功產生抽賞結果時，該次結果仍屬有效。玩家可重新登入，至「抽賞紀錄」或「中獎倉庫」查看最終結果。</p>
<p>因本平台系統異常造成重複扣款、重複扣除代幣或抽數、獎品紀錄錯誤、抽賞結果未正常建立或賞池數量顯示異常者，請透過<strong>客服工單、CHIAKI LINE 官方帳號或 Instagram @chiaki_gk.studies</strong> 聯繫官方小編，本平台將依伺服器、付款及抽賞紀錄查核處理。</p>
<p>會員中心之抽賞紀錄<strong>保留最近 3 個月</strong>，超過者自最舊一筆起自動移除；本平台依法保存之交易紀錄另行封存，如需查詢較早紀錄，請透過客服申請。</p>`],
['七、獎品圖片與實際商品', `<p>活動頁面之商品圖片可能包含官方宣傳圖、商品示意圖、廠商或工作室提供圖片及實品拍攝照片。因拍攝光線、螢幕顯示、生產批次或製程等因素，實際商品之顏色與細節可能與圖片存在些微差異，以實品為準。</p>
<p>GK 雕像、雕像、盒玩、公仔、景品、模型、卡片等收藏品，可能因製程與工藝特性存在輕微溢色、塗裝差異、細微刮痕、接縫線、包裝壓痕、紙盒輕微折損、出廠痕跡、組裝誤差或手工製作差異。是否屬於瑕疵，依商品種類、製造商或工作室標準、正常製程及實際狀況個別判定；本條不排除消費者依法享有之瑕疵擔保權利。</p>`],
['八、獎品版本與規格', `<p>玩家應於抽賞前確認商品頁面所載之品牌／工作室、角色、尺寸、款式、版本、地區版本、官方或授權資訊、是否為代理版、海外版、拆封確認款、展示品或二手商品、特殊品況等資訊。活動頁面已清楚揭露者，即視為該次抽賞商品資訊之一部分。</p>`],
['九、獎品保管與逾期處理', `<p>抽中之獎品將存放於會員帳戶之「中獎倉庫」，玩家可隨時申請出貨或回收。</p>
${ol(['獎品自入庫日起<strong>免費保管 30 天</strong>，本平台將於<strong>到期前 7 天及到期當天</strong>以站內通知及玩家設定之管道提醒。',
 '逾期未申請出貨之<strong>可回收獎品</strong>，將依該套公告之回收值<strong>自動轉換為平台代幣（不可退款、無法轉換）</strong>，轉換後原獎品不再寄送。',
 '<strong>不可回收之獎品</strong>（如大獎）不會自動轉換，本平台將另行通知玩家處理。',
 '玩家有自行維護正確聯絡資料、確認獎品狀態及保管期限之責任。'])}
<h3>（一）小獎退件處理</h3><p>「小獎」之認定以各賞池活動頁面或平台分類為準。小獎因收件資料錯誤、地址無法配送、收件人未領取、超商逾期未取等可歸責於玩家之因素遭物流退回者，本平台得依事前公告之回收值，扣除已實際發生之物流或必要費用後，轉換為平台代幣（不可退款）匯入玩家帳號，原小獎不再重新寄送。</p>
<h3>（二）大獎退件處理</h3><p>「大獎」之認定以各賞池活動頁面或平台分類為準。大獎因可歸責於玩家之因素遭退回者，本平台將通知玩家，並提供 <strong>3 日免費保管期</strong>；玩家應於期間內聯繫官方小編確認收件資料並重新申請寄送，重新寄送之物流費用由玩家於出貨前支付。</p>
<h3>（三）大獎延長保管</h3><p>免費保管期屆滿仍未完成重新寄送者，進入延長保管程序。針對大型、高價或高材積獎品，延長保管費依事前公告之標準收取（現行標準：新臺幣 3,000 元／月），最長延長 3 個月。逾期仍未處理者，依事前公告及玩家已同意之方式處理；涉及玩家既有財產權益者，仍依相關法令辦理。</p>`],
['十、運費預收與退還', `${ol(['運費於該套<strong>首次抽賞時按套預收</strong>：宅配到府每份 150–300 代幣；7-ELEVEN 交貨便、全家店到店每份 60–150 代幣，實際金額依各套公告。',
 '每份運費對應該套 <strong>20 件小獎</strong>，大獎、中獎不計入；同一套抽中之小獎（含本次購買數量）<strong>滿 20 件即再預收一份</strong>，因此單次抽 20 抽以上時將預收兩份。',
 '玩家回收小獎時，<strong>每回收 1 件，退還該份運費之 1/20</strong>（例如運費 200 代幣，回收 1 件退還 10 代幣、回收 3 件退還 30 代幣），以平台代幣即時入帳，屬不可退款代幣；同一套累計計算，不足 1 代幣之零頭於下次回收時補足。已回收之小獎仍計入該套件數，不重複退還。',
 '逾期自動轉換之可回收小獎，比照前項按件退還運費。',
 '超大型、高材積、離島或特殊配送之商品，可能另有物流費用，將於出貨前通知並經玩家確認。'])}`],
['十一、出貨與物流', `${ul(['官方商品依官方出貨時程辦理，平台商品依平台公告之出貨時程辦理，實際出貨時間以平台通知及物流狀況為準。',
 '玩家同時持有多項獎品時，可申請合併出貨。',
 '獎品寄出後，本平台將提供<strong>物流公司與物流單號</strong>，玩家可於「中獎倉庫」查看並查詢物流進度。',
 '配送方式以抽賞時預收運費之方式為準，如需變更請聯繫官方小編；由超商改為宅配者，需補足運費差額。'])}`],
['十二、收件資料', `<p>申請出貨前，請確認收件人姓名、聯絡電話、配送地址或超商門市等資料正確。本平台僅於物流、報關或法律要求之必要範圍內蒐集相關資料，個人資料之蒐集、處理及利用依《隱私權政策》辦理。</p>
<p>因玩家提供之資料錯誤、不完整或未及時更新，造成配送失敗、商品退回或額外物流、倉儲費用者，相關合理必要費用由玩家負擔。</p>`],
['十三、商品開箱與瑕疵處理', `<p>建議玩家於拆封時全程錄影，自未拆封之外箱開始，完整記錄外箱六面、配送單資訊、封口狀況、開箱過程、商品數量與外觀、瑕疵位置及包材狀況。</p>
<p>如有商品短缺、寄錯商品、嚴重破損、與訂單內容不符或其他明顯異常，請於收到商品後 <strong>7 日內</strong>透過客服工單聯繫，本平台將依訂單、抽賞、出貨紀錄、開箱影片、物流資料及商品實際狀況查核協助。前述 7 日為建議反映期間，不影響玩家依法得主張之權利。</p>`],
